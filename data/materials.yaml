# Candidate materials for MechAgent.
#
# These are TYPICAL handbook values (ASM, MatWeb style data sheets and Shigley's estimates),
# not certified design allowables. Replace them with supplier or MMPDS data for real designs.
#
# Units: MPa, tonne/mm^3, EUR/kg, cm^3/min.
# Fatigue data: smooth polished specimens, fully reversed loading (R = -1).
# For steels without a measured curve we use Shigley's estimates:
#   S at 1e3 cycles = f * Sut (f from Shigley fig. 6-18), endurance limit = 0.5 * Sut at 1e6.
# Prices and removal rates are rough indications to compare materials, not quotes.

Al6061-T6:
  category: aluminium
  youngs_modulus: 68900
  poisson_ratio: 0.33
  density: 2.70e-9
  yield_strength: 276
  ultimate_strength: 310
  cost_per_kg: 4.0
  removal_rate: 40
  fatigue:
    strength_at_1e3: 279       # 0.9 * Sut
    knee_strength: 96.5        # fatigue strength at 5e8 cycles, R.R. Moore test
    knee_cycles: 5.0e8
    endurance_limit: false
    source: typical data sheet value at 5e8 cycles, 0.9 Sut at 1e3
  source: typical handbook values

