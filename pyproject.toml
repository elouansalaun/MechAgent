[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechagent"
version = "0.0.1"
description = "Autonomous mechanical design and optimization agent driven by deterministic engineering tools"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "cadquery>=2.4",
    "gmsh>=4.12",
    "optuna>=3.6",
    "pyvista>=0.43",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "streamlit>=1.35",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
mechagent-check-env = "mechagent.core.environment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "external: needs an external tool (CalculiX, Gmsh, LM Studio) installed on the machine",
]
log_level = "INFO"
filterwarnings = [
    # ezdxf, pulled in by CadQuery, still uses the old pyparsing names
    "ignore::DeprecationWarning:ezdxf.*",
    # VTK, behind PyVista, still sets array shapes the way NumPy 2.5 deprecates
    "ignore::DeprecationWarning:vtkmodules.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
